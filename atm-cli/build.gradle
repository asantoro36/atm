plugins {
    id 'java'
    id 'application'
    id 'jacoco'
}

group = 'com.demo'
version = '0.0.1-SNAPSHOT'
description = 'atm-cli'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    // Valida sintaxis y API de Java 8 aunque Gradle corra con un JDK mas nuevo
    options.release = 8
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:4.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

testing {
    suites {
        integrationTest(JvmTestSuite) {
            useJUnitJupiter('5.10.2')
            dependencies {
                implementation project()
                implementation 'com.github.tomakehurst:wiremock-jre8:2.35.2'
            }
        }
    }
}

application {
    mainClass = 'com.demo.atmcli.AtmCliApplication'
}

tasks.named('test') {
    useJUnitPlatform()
}

def coverageData = fileTree(layout.buildDirectory.dir('jacoco')) {
    include '*.exec'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test'), testing.suites.integrationTest
    executionData.setFrom(coverageData)
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('test'), testing.suites.integrationTest
    executionData.setFrom(coverageData)
    violationRules {
        rule {
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

tasks.named('check') {
    dependsOn testing.suites.integrationTest
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
